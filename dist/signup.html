<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – LifeTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #faf6f0 0%, #f1ca93 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      border: 1px solid rgba(244,194,119,0.2);
    }
    .brand {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e8a045;
      margin-bottom: 28px;
    }
    h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 400;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 36px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #374151;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: #374151;
      background: #fafafa;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 20px;
    }
    input:focus {
      border-color: #f4c277;
      box-shadow: 0 0 0 3px rgba(244,194,119,0.15);
      background: white;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #1a1a1a;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 4px;
    }
    button:hover { background: #e8a045; }
    .msg {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 500;
      min-height: 20px;
    }
    .divider {
      border: none;
      border-top: 1px solid #f3f4f6;
      margin: 28px 0 20px;
    }
    .login-link {
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
    }
    .login-link a {
      color: #e8a045;
      font-weight: 600;
      text-decoration: none;
    }
    .login-link a:hover { text-decoration: underline; }
    .back-home {
      text-align: center;
      margin-top: 16px;
    }
    .back-home a {
      font-size: 12px;
      color: #9ca3af;
      text-decoration: none;
    }
    .back-home a:hover { color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">✦ LifeTrack</div>
    <h2>Create Account 🌿</h2>
    <p class="sub">Join LifeTrack and start your wellness journey</p>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="password">Password</label>
<div style="position:relative;">
  <input type="password" id="password" placeholder="Minimum 6 characters" style="padding-right:44px;">
  <span onclick="togglePassword('password', 'eye-icon-1')" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:16px; user-select:none;" id="eye-icon-1">👁️</span>
</div>

<label for="confirmPassword">Confirm Password</label>
<div style="position:relative;">
  <input type="password" id="confirmPassword" placeholder="Repeat your password" style="padding-right:44px;">
  <span onclick="togglePassword('confirmPassword', 'eye-icon-2')" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:16px; user-select:none;" id="eye-icon-2">👁️</span>
</div>
    
    <button onclick="handleSignup()">Create Account</button>
    <div id="msg" class="msg"></div>

    <hr class="divider">

    <p class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </p>
    <div class="back-home">
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

  <script>
    function togglePassword(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  if (input.type === "password") {
    input.type = "text";
    icon.textContent = "🫆";
  } else {
    input.type = "password";
    icon.textContent = "👁️";
  }
}
    async function handleSignup() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;
      const msg = document.getElementById("msg");

      if (!email || !password || !confirm) {
        msg.style.color = "red";
        msg.textContent = "Please fill in all fields.";
        return;
      }
      if (password.length < 6) {
        msg.style.color = "red";
        msg.textContent = "Password must be at least 6 characters.";
        return;
      }
      if (password !== confirm) {
        msg.style.color = "red";
        msg.textContent = "Passwords do not match.";
        return;
      }

      try {
        const res = await fetch("https://lifetrack-api-3jzf.onrender.com/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          msg.style.color = "green";
          msg.textContent = data.message;
          setTimeout(() => window.location.href = "login.html", 1500);
        } else {
          msg.style.color = "red";
          msg.textContent = data.message;
        }
      } catch {
        msg.style.color = "red";
        msg.textContent = "Cannot connect to server. Is backend running?";
      }
    }
  </script>
</body>
</html>
