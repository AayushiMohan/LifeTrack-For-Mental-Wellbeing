<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – LifeTrack</title>
  <link rel="stylesheet" href="output.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(to bottom, #ffffff, #f1ca93);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1e1b4b;
    }
    p.sub {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
      box-sizing: border-box;
      outline: none;
      transition: border 0.2s;
    }
    input:focus {
      border-color: #4f46e5;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #4338ca;
    }
    .msg {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 500;
    }
    .msg.success { color: green; }
    .msg.error { color: red; }
    .login-link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #6b7280;
    }
    .login-link a {
      color: #4f46e5;
      font-weight: 600;
      text-decoration: none;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Account 🌿</h2>
    <p class="sub">Join LifeTrack and start your wellness journey</p>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Minimum 6 characters">

    <label for="confirmPassword">Confirm Password</label>
    <input type="password" id="confirmPassword" placeholder="Repeat your password">

    <button onclick="handleSignup()">Create Account</button>

    <div id="msg" class="msg"></div>

    <div class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <script>
    async function handleSignup() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const msg = document.getElementById("msg");

      if (!email || !password || !confirmPassword) {
        msg.textContent = "Please fill in all fields.";
        msg.className = "msg error";
        return;
      }

      if (password.length < 6) {
        msg.textContent = "Password must be at least 6 characters.";
        msg.className = "msg error";
        return;
      }

      if (password !== confirmPassword) {
        msg.textContent = "Passwords do not match.";
        msg.className = "msg error";
        return;
      }

      try {
        const response = await fetch("http://localhost:3000/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          msg.textContent = data.message;
          msg.className = "msg success";
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);
        } else {
          msg.textContent = data.message;
          msg.className = "msg error";
        }
      } catch (err) {
        msg.textContent = "Cannot connect to server. Is backend running?";
        msg.className = "msg error";
      }
    }
  </script>
</body>
</html>
